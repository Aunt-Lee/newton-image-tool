<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>牛顿AI图像工具</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="page-glow page-glow-left" aria-hidden="true"></div>
    <div class="page-glow page-glow-right" aria-hidden="true"></div>
    <main class="app-shell">
      <aside class="panel settings-panel">
        <div class="brand-row">
          <div class="brand-block">
            <span class="eyebrow">https://newtonrouter.com</span>
            <h1>牛顿AI图像工具</h1>
            <p>本地生成，直接保存，开箱即用。</p>
          </div>
          <span id="serverState" class="state-pill">本地</span>
        </div>

        <label class="field">
          <span class="field-label-row">
            <span>API 密钥</span>
            <a href="https://newtonrouter.com" target="_blank" rel="noreferrer">获取密钥</a>
          </span>
          <input id="apiKey" type="password" autocomplete="off" placeholder="请输入 sk-... 密钥">
        </label>

        <div class="button-row">
          <button id="checkStreaming" type="button">检测流式能力</button>
        </div>

        <input id="baseUrl" type="hidden" value="https://image.newtonrouter.com">

        <div class="field">
          <span>使用方式</span>
          <div class="segmented" role="radiogroup" aria-label="使用方式">
            <button data-mode="generations" type="button">Generations</button>
            <button class="active" data-mode="chat" type="button">Chat Stream</button>
          </div>
        </div>

        <div class="field">
          <span>分辨率</span>
          <select id="resolutionPreset" aria-label="常见分辨率">
            <option value="1024x1024">1024x1024（正方形）</option>
            <option value="1536x1024">1536x1024（横向）</option>
            <option value="1024x1536">1024x1536（竖屏）</option>
            <option value="2048x2048">2048x2048（2K 正方形）</option>
            <option value="2048x1152">2048x1152（2K 横向）</option>
            <option value="3840x2160">3840x2160（4K 横向）</option>
            <option value="2160x3840">2160x3840（4K 竖屏）</option>
            <option value="auto">auto（默认）</option>
          </select>
          <input id="resolution" type="text" spellcheck="false" placeholder="填写以上尺寸之一或 auto">
        </div>

        <section class="subpanel">
          <div class="subpanel-head">
            <strong>保存设置</strong>
          </div>

          <label class="field">
            <span>保存位置</span>
            <div class="inline-field">
              <input id="saveDir" type="text" spellcheck="false">
              <button id="chooseDir" class="icon-button" type="button" title="选择文件夹" aria-label="选择文件夹">
                <span>...</span>
              </button>
            </div>
          </label>
        </section>

        <label class="field">
          <span>图片描述</span>
          <textarea id="prompt" rows="8" placeholder="输入你想生成的画面内容。"></textarea>
        </label>

        <details class="advanced">
          <summary>高级参数</summary>
          <textarea id="extraJson" rows="5" spellcheck="false" placeholder='{"quality":"high"}'></textarea>
          <p>这里填写的内容会自动合并到请求参数中；如需附加请求头，可写 {"headers":{"X-...":"..."}}。</p>
        </details>

        <button id="generate" class="primary" type="button">生成并保存</button>
      </aside>

      <section class="workspace">
        <div id="gallery" class="gallery empty">
          <div class="empty-state">
            <strong>还没有图片</strong>
            <span>生成成功后会自动保存到指定目录，并在这里预览。</span>
          </div>
        </div>

        <div class="workspace-head">
          <div class="workspace-title">
            <h2>图片</h2>
            <p id="statusText">准备就绪</p>
          </div>
          <button id="clearResults" type="button">清空</button>
        </div>

        <section class="panel log-panel">
          <div class="log-head">
            <h2>处理记录</h2>
            <button id="clearLog" type="button">清空日志</button>
          </div>
          <pre id="log"></pre>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
